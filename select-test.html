<!DOCTYPE html>
<html>
<body>

<h1>The select element</h1>

<p>The select element is used to create a drop-down list.</p>

<form action="/action_page.php">
  <label for="cars">Choose a car:</label>
  <select name="cars" id="cars">
    <option value="volvo">Volvo</option>
    <option value="saab">Saab</option>
    <option value="opel">Opel</option>
    <option value="audi">Audi</option>
  </select>
  <br><br>
  <input type="submit" value="Submit">
</form>

<p>Click the "Submit" button and the form-data will be sent to a page on the 
server called "action_page.php".</p>

<style>
select {
  appearance: none;
  -webkit-appearance: none;
  -moz-appearance: none;
	
  border: none;
  outline: none;
  background: none;
	
  padding: 8px 10px;
  font-size: 16px;
  line-height: 100%;
  color: green;
  outline: none;
  border: 1px solid #ccc;
}
	
/* Hover */
select:hover {
  border: none;
  outline: none;
}

/* Focus */
select:focus,
select:focus-visible {
  outline: none;
  box-shadow: none;
}

/* Active */
select:active {
  outline: none;
  box-shadow: none;
}

/* Disabled */
select:disabled {
  background: none;
  color: inherit;
  opacity: 1; /* tránh bị mờ */
  cursor: not-allowed;
}

/* Invalid / Valid */
select:invalid,
select:valid {
  box-shadow: none;
  outline: none;
}

/* IE / Edge cũ */
select::-ms-expand {
  display: none;
}

</style>

</body>
</html>
